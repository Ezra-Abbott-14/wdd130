<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        main{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: lighter;
            width: 80%;
            margin: 0 auto;
            max-height: 90%;
            background-image: url(images/christus.webp);
            background-size: cover;
            border: solid 10px black;
            border-radius: 35px;
        }
        img{
            border: solid 5px white;
            border-radius: 100%;
            width: 75px;
            height: 75px;
            margin: 0 auto;
            object-fit:cover;
        }
        #content{
            width:65%;
            margin: 0 auto;
        }
        #presidency{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        #presidency img{
            width: 100px;
            height: 100px;
        }
        #twelve{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: 1fr 1fr 1fr;
            margin-bottom: 30px;
            gap: 10px;
        }
        #oaks{
            width: 125px;
            height: 125px;
        }
        h1{
            margin-top: 0;
            color:white;
            text-align: center;
        } 
        
        h2{
            color:white;
            text-align: center;
        }


    </style>
</head>
<body>
    <main>
        <div id="content">
        <h1>First Presidency</h1>
        <div id="presidency">
            <img src="images/eyring.webp" alt="Elder Eyring">
            <img style = "height: 125px ; width: 125px;" id="oaks" src="images/oaks.webp" alt="President oaks">
            <img src="images/christofferson.webp" alt="">
        </div>
        <h2>Quorm of the twelve apostles</h2>
        <div id = "twelve"> 
            <img src="images/uchtdorf.webp" alt="">
            <img src="images/bednar.webp" alt="">
            <img src="images/cook.webp" alt="">
            <img src="images/anderson.webp" alt="">
            <img src="images/rasband.webp" alt="">
            <img src="images/stevenson.webp" alt="">
            <img src="images/renlund.webp" alt="">
            <img src="images/gong.webp" alt="">
            <img src="images/soares.webp" alt="">
            <img src="images/kearon.webp" alt="">
            <img src="images/causse.webp" alt="">
            <img src="images/gilbert.webp" alt="">
        </div>
        </div>
    </main>
</body>
</html>
